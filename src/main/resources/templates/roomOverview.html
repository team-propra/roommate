<!DOCTYPE html>
<html lang="en" th:object="${room}">
<head>
    <meta charset="UTF-8">
    <title>Raum Übersicht</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<h1>Raum <span th:text="*{roomNumber}"></span></h1>

<div class="container mt-5">

    <div class="col-md-6">
        <h2>Liste aller Arbeitsplätze</h2>
        <table class="table table-striped">
            <tbody>
            <tr th:each="workspace : *{workspaces}">
                <td><a th:href="@{'/room/' + ${room.roomID} + '/workspace/' + ${workspace.workspaceID}}" th:text="${workspace.workspaceNumber}"></a></td>
                <td th:text="${workspace.items}"></td>
                <td th:text="${workspace.bookedTimeframes}"></td>
                <td>
                    <form th:action="@{'/deleteWorkspace/' + ${workspace.workspaceID}}" method="post">
                        <input id="roomIDDelete" type="hidden" name="roomIDDelete" th:value="*{roomID}" required/>
                        <button type="submit">X</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="container">
        <form th:action="@{'/createWorkspace'}" method="post">
            <label for="createWorkspace">Neuen Arbeitsplatz hinzufügen:</label>
            <input id="createWorkspace" type="text" name="newWorkspace" required/>
            <input id="roomIDCreate" type="hidden" name="roomIDCreate" th:value="*{roomID}" required/>
            <input type="submit">
        </form>
    </div>

</div>
</body>
</html>

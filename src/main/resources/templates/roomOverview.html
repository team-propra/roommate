<!DOCTYPE html>
<html lang="en" th:object="${room}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raum Übersicht</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/roommate.css}">
</head>
<body>
<div th:replace="~{fragments/shell :: navbar}"></div>
<main class="page-shell">
    <header class="page-header">
        <div>
            <p class="page-kicker">Room Inventory</p>
            <h1>Raum <span th:text="*{roomNumber}"></span></h1>
            <p class="page-subtitle">Arbeitsplätze und gebuchte Zeitfenster für diesen Raum.</p>
        </div>
        <a class="btn btn-secondary" href="/edit">Zurück zum Admin Center</a>
    </header>

    <section class="table-panel">
        <h2>Arbeitsplätze</h2>
        <div class="table-responsive">
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>Workspace</th>
                    <th>Ausstattung</th>
                    <th>Buchungen</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="workspace : *{workspaces}">
                    <td><a th:href="@{'/room/' + ${room.roomID} + '/workspace/' + ${workspace.workspaceID}}" th:text="${workspace.workspaceNumber}"></a></td>
                    <td th:text="${workspace.items}"></td>
                    <td th:text="${workspace.bookedTimeframes}"></td>
                    <td class="text-right">
                        <form th:action="@{'/deleteWorkspace/' + ${workspace.workspaceID}}" method="post">
                            <input id="roomIDDelete" type="hidden" name="roomIDDelete" th:value="*{roomID}" required>
                            <button class="icon-danger" type="submit">X</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

    <section class="form-panel">
        <h2>Neuen Arbeitsplatz hinzufügen</h2>
        <form class="toolbar" th:action="@{'/createWorkspace'}" method="post">
            <label class="sr-only" for="createWorkspace">Neuen Arbeitsplatz hinzufügen</label>
            <input id="createWorkspace" type="text" name="newWorkspace" required placeholder="Arbeitsplatznummer">
            <input id="roomIDCreate" type="hidden" name="roomIDCreate" th:value="*{roomID}" required>
            <input type="submit" value="Anlegen">
        </form>
    </section>
</main>
</body>
</html>

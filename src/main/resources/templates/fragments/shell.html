<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      xmlns:th="http://www.thymeleaf.org">
<body>
<nav class="app-nav" th:fragment="navbar">
    <a class="brand" href="/">
        <span class="brand-mark">RM</span>
        <span>Roommate</span>
    </a>
    <div class="nav-links">
        <a href="/" th:text="#{nav.dashboard}">Dashboard</a>
        <a href="/rooms" th:text="#{nav.workspaces}">Arbeitsplätze</a>
        <a sec:authorize="hasRole('ADMIN')" href="/edit" th:text="#{nav.admin}">Admin</a>
        <a sec:authorize="hasRole('ADMIN')" href="/rooms/add" th:text="#{nav.addRoom}">Raum hinzufügen</a>
        <a sec:authorize="isAnonymous()" href="/oauth2/authorization/github" th:text="#{nav.login}">GitHub Login</a>
        <a th:href="@{${currentPath}(lang='de')}" th:aria-label="#{nav.languageGerman}">DE</a>
        <a th:href="@{${currentPath}(lang='en')}" th:aria-label="#{nav.languageEnglish}">EN</a>
    </div>
</nav>
</body>
</html>

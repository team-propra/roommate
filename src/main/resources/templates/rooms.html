<!DOCTYPE html>
<html lang="en" xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raumreservierung</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/roommate.css}">
</head>
<body>
<div th:replace="~{fragments/shell :: navbar}"></div>
<main class="page-shell">
    <header class="page-header">
        <div>
            <p class="page-kicker">Booking Console</p>
            <h1>Arbeitsplatzreservierung</h1>
            <p class="page-subtitle">Arbeitsplätze nach Zeitraum und Ausstattung filtern.</p>
        </div>
        <div class="actions">
            <a sec:authorize="isAnonymous()" class="btn btn-secondary" href="/oauth2/authorization/github">Zum Buchen anmelden</a>
            <a sec:authorize="hasRole('ADMIN')" class="btn btn-secondary" href="/rooms/add">Räume hinzufügen</a>
        </div>
    </header>

    <section class="form-panel">
        <form method="GET">
            <div class="filter-grid">
                <div class="form-group">
                    <label for="datum">Datum</label>
                    <input type="date" id="datum" name="datum" class="form-control" required th:value="${date}">
                </div>
                <div class="form-group">
                    <label>Uhrzeit</label>
                    <div class="time-fields">
                        <input type="time" id="startUhrzeit" name="startUhrzeit" class="form-control" required th:value="${startTime}" aria-label="Von">
                        <input type="time" id="endUhrzeit" name="endUhrzeit" class="form-control" required th:value="${endTime}" aria-label="Bis">
                    </div>
                </div>
                <div class="form-group">
                    <label for="gegenstaende">Gegenstände im Raum</label>
                    <select multiple id="gegenstaende" name="gegenstaende" class="form-control">
                        <option th:each="item : ${items}" th:value="${item.type}" th:text="${item.type}" th:selected="${gegenstaende != null and gegenstaende.contains(item.type)}"></option>
                    </select>
                </div>
            </div>
            <button type="submit" class="btn">Passenden Raum suchen</button>
        </form>
    </section>

    <section class="table-panel">
        <div class="table-responsive">
            <table class="table">
                <thead>
                <tr>
                    <th>Raum</th>
                    <th>Workspace</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="roomBookingModel : ${roomBookingModels}">
                    <td th:text="${'Raum ' + roomBookingModel.roomNumber}"></td>
                    <td th:text="${'Workspace ' + roomBookingModel.workspaceNumber}"></td>
                    <td>
                        <a class="btn btn-secondary" th:href="@{/room/{roomId}/workspace/{workspaceId}(roomId=${roomBookingModel.roomID},workspaceId=${roomBookingModel.workspaceID})}">Workspace ansehen</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>

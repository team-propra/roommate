<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{error.generic.title}">Fehler</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/roommate.css}">
</head>
<body>
<div th:replace="~{fragments/shell :: navbar}"></div>
<main class="page-shell">
    <section class="panel">
        <p class="page-kicker" th:text="#{error.generic.title}">Fehler</p>
        <h1 th:text="#{error.generic.heading}">Unser Error!</h1>
        <p class="page-subtitle" th:text="#{error.generic.subtitle}">Es ist ein unerwarteter Fehler aufgetreten.</p>
        <div class="actions mt-3">
            <a class="btn" href="/" th:text="#{nav.dashboard}">Dashboard</a>
            <a class="btn btn-secondary" href="/rooms" th:text="#{nav.workspaces}">Arbeitsplätze</a>
        </div>
    </section>
</main>
</body>
</html>

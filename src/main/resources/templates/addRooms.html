<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raum hinzufügen</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/roommate.css}">
</head>
<body>
<div th:replace="~{fragments/shell :: navbar}"></div>
<main class="page-shell">
    <header class="page-header">
        <div>
            <p class="page-kicker">Room Provisioning</p>
            <h1>Raum hinzufügen</h1>
            <p class="page-subtitle">Neuen Raum für die Arbeitsplatzbuchung registrieren.</p>
        </div>
        <a class="btn btn-secondary" href="/rooms">Zur Raumbuchungsübersicht</a>
    </header>

    <section class="form-panel">
        <form method="post" th:action="@{/rooms/add}">
            <div class="form-group">
                <label for="roomNumber">Raumnummer</label>
                <input name="roomNumber" id="roomNumber" type="text" required>
            </div>
            <input type="submit" value="Raum anlegen">
        </form>
    </section>
</main>
</body>
</html>
